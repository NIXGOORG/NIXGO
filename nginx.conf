server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Compresión
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript image/svg+xml application/json;

    # Headers de seguridad
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # OJO: nginx NO hereda los add_header del bloque padre en cualquier location
    # que defina los suyos. Por eso cada location de abajo los repite; si se
    # omiten, esa ruta se sirve sin headers de seguridad.

    # HTML: siempre revalidar para que los cambios se vean al instante
    location = /index.html {
        add_header X-Content-Type-Options    "nosniff"        always;
        add_header X-Frame-Options           "SAMEORIGIN"     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cache-Control             "no-cache, must-revalidate" always;
    }

    # CSS y JS: revalidar siempre.
    # Los nombres de archivo no llevan hash, así que una caché larga entrega
    # HTML nuevo con estilos y scripts viejos y la página se rompe. Con
    # no-cache el navegador pregunta primero y nginx responde 304 vía ETag:
    # no se vuelve a descargar el archivo, pero nunca se sirve una versión
    # obsoleta. Si algún día los assets llevan hash en el nombre, mover esta
    # regla al bloque de caché larga de abajo.
    location ~* \.(?:css|js)$ {
        add_header X-Content-Type-Options    "nosniff"        always;
        add_header X-Frame-Options           "SAMEORIGIN"     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cache-Control             "no-cache, must-revalidate" always;
    }

    # Imágenes y fuentes: caché larga (cambian poco y se renombran al cambiar)
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        add_header X-Content-Type-Options    "nosniff"    always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
